<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Results summary component</title>

</head>

<body>
  <div class="container">
    <div class="card1">


      <p class="num1">Your Result</p>
      <div class="result">
        <p class="num2">76</p>
        <p class="ext">of 100</p>
      </div>


      <div class="id">
        <p class="num">Great</p>
        <p class="num3">
          You scored higher than 65% of<br>
          the people who have taken<br> these tests.
        </p>
      </div>
    </div>
    <div class="card2">

      <p class="num4"><b>Summary</b></p>

      <div class="res1">
        <img src="./assets/images/icon-reaction.svg">
        <p class="num5">Reaction</p>
        <p><b style="color: black;">80 </b> / 100 </p>
      </div>

      <div class="res2">
        <img src="./assets/images/icon-memory.svg">
        <p class="num6">Memory</p>
        <p><b style="color: black;">92 </b> / 100 </p>
      </div>

      <div class="res3">
        <img src="./assets/images/icon-verbal.svg">
        <p class="num7">Verbal</p>
        <p><b style="color: black;">61 </b> / 100 </p>
      </div>

      <div class="res4">
        <img src="./assets/images/icon-visual.svg">
        <p class="num8">Visual</p>
        <p><b style="color: black;">73 </b> / 100 </p>
      </div>

      <div class="button">Continue</div>
    </div>
  </div>
</body>

</html>
